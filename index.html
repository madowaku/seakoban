<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#073f57">
<meta name="description" content="SEAKOBAN（ぷかばん）：海に浮かぶ荷物を押して係留する5×5パズル。">
<title>SEAKOBAN | ぷかばん</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<main class="shell">
<header class="brand"><div class="brand-icon">〰<span>▣</span></div><div class="brand-copy"><p class="overline">FLOAT • PUSH • DOCK</p><h1>SEA<span>KOBAN</span></h1><p class="brand-sub">ぷかばん　小さな海の倉庫番</p></div><button id="sound" aria-label="効果音を切り替え">♪ OFF</button></header>
<section class="game">
 <div class="stage-heading"><div><p class="overline">VOYAGE <span id="voyage">01 / 10</span></p><h2 id="title">ぷかっ</h2></div><div class="meter"><small>MOVES</small><strong id="moves">00</strong></div></div>
 <p id="lesson" class="lesson">荷物は、止まるところまで流れる。</p>
 <div id="board" class="board" tabindex="0" aria-label="海の盤面。スワイプして操作"></div>
 <p class="sea-label">◌　CARGO DELIVERY ZONE　◌</p>
 <div class="deliver"><span>係留した荷物</span><div class="bar"><div id="bar-fill"></div></div><span id="count">0 / 1</span></div>
 <nav class="actions" aria-label="ゲーム操作"><button id="undo">↶　UNDO</button><button id="retry">↻　RETRY</button><button id="stages">▦　STAGES</button></nav>
 <div class="pad" aria-label="移動ボタン"><button data-dir="up" aria-label="上">↑</button><div><button data-dir="left" aria-label="左">←</button><button data-dir="down" aria-label="下">↓</button><button data-dir="right" aria-label="右">→</button></div></div>
 <p class="instructions">矢印 / WASD ・ スワイプ / 方向ボタン ・ Z: UNDO</p>
 <p id="live" class="sr-only" aria-live="polite"></p>
</section><footer>SEA LEVEL 00 <span>NO TIMER. JUST TIDES.</span></footer>
</main>
<div id="selector" class="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="selector-title"><button id="close" class="close" aria-label="閉じる">✕</button><p class="overline">CHOOSE YOUR VOYAGE</p><h2 id="selector-title">航海図</h2><p>クリアすると次の海域が開放されます。</p><div id="level-list" class="level-list"></div></section></div>
<div id="victory" class="overlay" hidden><section class="dialog win" role="dialog" aria-modal="true" aria-labelledby="victory-title"><div class="anchor">⚓</div><p class="overline">CARGO SAFELY DELIVERED</p><h2 id="victory-title">係留完了！</h2><p><strong id="finished-moves">00</strong> MOVES</p><button id="next" class="next">NEXT VOYAGE　→</button><button id="again" class="again">もう一度遊ぶ ↻</button></section></div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
